<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homepage — Astranovas International School, Vizianagaram</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./dist/standalone.css" />
    <script>
      if (window.location.protocol !== 'file:') {
        var lc = document.createElement('link');
        lc.rel = 'stylesheet';
        lc.href = '/dist/standalone.css';
        document.head.appendChild(lc);
      }
    </script>
  </head>
  <body style="margin: 0; background-color: #FFFFFF; font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #012951; color: #FFFFFF; text-align: center; padding: 24px;">
        <div style="font-size: 32px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px;">
          ASTRANOVAS INTERNATIONAL SCHOOL
        </div>
        <div style="font-size: 14px; letter-spacing: 2px; color: #EA6645; font-weight: 700; text-transform: uppercase;">
          Vizianagaram · Andhra Pradesh
        </div>
      </div>
    </div>
    <script>
      window.__INITIAL_PAGE__ = 'home';
      (function() {
        var isFile = window.location.protocol === 'file:';
        var script = document.createElement('script');
        script.src = isFile ? './dist/standalone.js' : '/dist/standalone.js';
        script.onerror = function() {
          var fb = document.createElement('script');
          fb.src = isFile ? '/dist/standalone.js' : './dist/standalone.js';
          document.body.appendChild(fb);
        };
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
